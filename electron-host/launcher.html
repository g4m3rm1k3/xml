<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';">
    <title>Application Launcher</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            min-height: 100vh;
        }

        .container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 1.75rem;
            margin-bottom: 0.5rem;
            color: #f1f5f9;
        }

        header p {
            color: #94a3b8;
            font-size: 0.875rem;
        }

        .backends {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .backend-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .backend-card:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: #3b82f6;
            transform: translateY(-2px);
        }

        .backend-card.disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        .backend-icon {
            width: 48px;
            height: 48px;
            background: rgba(59, 130, 246, 0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .backend-info {
            flex: 1;
        }

        .backend-name {
            font-size: 1.125rem;
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 0.25rem;
        }

        .backend-description {
            font-size: 0.875rem;
            color: #94a3b8;
        }

        .backend-version {
            font-size: 0.75rem;
            color: #64748b;
            background: rgba(255, 255, 255, 0.05);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
        }

        .status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            padding: 1rem;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 8px;
            margin-top: 1rem;
        }

        .status.error {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            padding: 3rem;
            color: #94a3b8;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #64748b;
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .help-text {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 1rem;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            word-break: break-all;
        }

        .help-text code {
            background: rgba(255, 255, 255, 0.1);
            padding: 0.125rem 0.25rem;
            border-radius: 4px;
        }

        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: 1rem;
        }

        .settings-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        .settings-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
        }

        .version {
            font-size: 0.75rem;
            color: #64748b;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>🚀 Application Launcher</h1>
            <p>Select an application to start</p>
        </header>

        <div class="backends" id="backends">
            <div class="loading">
                <div class="spinner"></div>
                <span>Discovering applications...</span>
            </div>
        </div>

        <div class="status" id="status" style="display: none;">
            <div class="spinner"></div>
            <span id="status-text">Starting...</span>
        </div>

        <footer>
            <button class="settings-btn" onclick="window.electronAPI.openSettings()">⚙️ Settings</button>
            <span class="version">Electron Host v1.0.0</span>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('backends');
            const status = document.getElementById('status');
            const statusText = document.getElementById('status-text');

            // Load backends
            const backends = await window.electronAPI.getBackends();
            const backendsDir = await window.electronAPI.getBackendsDir();

            if (backends.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📦</div>
                        <p>No applications found</p>
                        <div class="help-text">
                            <strong>How to add applications:</strong><br><br>
                            1. Build your Flask app with PyInstaller<br>
                            2. Copy the entire output folder to:<br>
                            <code>${backendsDir}</code><br><br>
                            3. Restart this launcher
                        </div>
                    </div>
                `;
                return;
            }

            // Render backend cards
            container.innerHTML = backends.map(backend => `
                <div class="backend-card" data-name="${backend.name}">
                    <div class="backend-icon">⚡</div>
                    <div class="backend-info">
                        <div class="backend-name">${backend.displayName}</div>
                        <div class="backend-description">${backend.description || 'No description'}</div>
                    </div>
                    <div class="backend-version">v${backend.version}</div>
                </div>
            `).join('');

            // Handle clicks
            container.querySelectorAll('.backend-card').forEach(card => {
                card.addEventListener('click', async () => {
                    const backendName = card.dataset.name;

                    // Disable all cards
                    container.querySelectorAll('.backend-card').forEach(c => {
                        c.classList.add('disabled');
                    });

                    // Show status
                    status.style.display = 'flex';
                    status.classList.remove('error');
                    statusText.textContent = `Starting ${card.querySelector('.backend-name').textContent}...`;

                    // Launch backend
                    const result = await window.electronAPI.launchBackend(backendName);

                    if (!result.success) {
                        status.classList.add('error');
                        statusText.textContent = `Error: ${result.error}`;

                        // Re-enable cards after error
                        container.querySelectorAll('.backend-card').forEach(c => {
                            c.classList.remove('disabled');
                        });
                    }
                });
            });
        });
    </script>
</body>

</html>
